
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Princess 💜</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #ead9ff, #fce7f3, #d9c5ff);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    text-align: center;
    color: #75449b;
}

.container {
    width: 100%;
    max-width: 500px;
    padding: 25px;
    animation: fadeIn 1.5s ease;
}

h1 {
    font-size: 36px;
    margin-bottom: 15px;
    color: #8e44ad;
}

.subtitle {
    font-size: 18px;
    margin-bottom: 45px;
}

.envelope {
    font-size: 115px;
    cursor: pointer;
    display: inline-block;
    filter: drop-shadow(0 10px 15px #ad83d5);
    animation: float 2s infinite ease-in-out;
    transition: transform 0.5s;
}

.envelope:hover {
    transform: scale(1.12);
}

.tap {
    margin-top: 25px;
    font-size: 16px;
    color: #9255ae;
    animation: pulse 1.5s infinite;
}

#surprise {
    display: none;
    animation: fadeIn 1.5s ease;
}

video {
    width: 100%;
    max-height: 65vh;
    border-radius: 20px;
    margin-top: 25px;
    background: #000;
    box-shadow: 0 10px 30px #a77bc2;
}

.final-message {
    font-size: 25px;
    margin-top: 25px;
    color: #8e44ad;
    line-height: 1.5;
}

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 20px;
    animation: rise 7s linear infinite;
    pointer-events: none;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes rise {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<div class="container">

    <!-- FIRST SCREEN -->
    <div id="welcome">

        <h1>Hey Princess! 💜</h1>

        <p class="subtitle">
            Your prince left a surprise for you...
        </p>

        <div class="envelope" onclick="openSurprise()">
            💌
        </div>

        <p class="tap">
            Tap to open your surprise ✨
        </p>

    </div>

    <!-- SURPRISE SCREEN -->
    <div id="surprise">

        <video id="myVideo"
               controls
               playsinline
               preload="metadata">
            <source src="princess-surprise.mp4" type="video/mp4">
            Your browser does not support video.
        </video>

        <p class="final-message">
            I hope you smile,<br>
            my princess! ❤️
        </p>

    </div>

</div>

<script>

function openSurprise() {

    document.getElementById("welcome").classList.add("hidden");

    document.getElementById("surprise").style.display = "block";

    const video = document.getElementById("myVideo");

    video.play().catch(() => {
        video.controls = true;
    });

    createHearts();
}

function createHearts() {

    const emojis = ["💜", "❤️", "💕", "✨", "💗"];

    for (let i = 0; i < 18; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
            emojis[Math.floor(Math.random() * emojis.length)];

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.animationDelay = Math.random() * 5 + "s";

        heart.style.animationDuration =
            (5 + Math.random() * 5) + "s";

        document.body.appendChild(heart);
    }
}

</script>

</body>
</html>
